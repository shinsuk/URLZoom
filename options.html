<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>URLZoom Options</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .url-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button { cursor: pointer; padding: 4px 8px; }
    .delete-btn { background: #f44336; color: white; border: none; border-radius: 4px; }
    .edit-btn { background: #4CAF50; color: white; border: none; border-radius: 4px; margin-right: 5px; }
    .zoom-input { width: 60px; }
    .title-input { width: 100%; min-width: 150px; box-sizing: border-box; }
    .url-input { width: 100%; min-width: 250px; box-sizing: border-box; }
    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .save-all-btn { background: #2196F3; color: white; border: none; border-radius: 4px; padding: 6px 14px; font-weight: bold; font-size: 14px; }
    .save-all-btn:hover { background: #1976D2; }
  </style>
</head>
<body>
  <div class="header-container">
    <h2 style="margin: 0;">저장된 URL 줌 설정</h2>
    <button id="saveAllBtn" class="save-all-btn">전체 저장</button>
  </div>
  <table>
    <thead>
      <tr>
        <th id="sort-title" style="cursor: pointer;" title="제목 기준으로 정렬">제목 ↕</th>
        <th id="sort-url" style="cursor: pointer;" title="URL 기준으로 정렬">URL ↕</th>
        <th id="sort-zoom" style="cursor: pointer;" title="줌 비율 기준으로 정렬">Zoom (%) ↕</th>
        <th>작업</th>
      </tr>
    </thead>
    <tbody id="urlList">
      <!-- 동적으로 추가됨 -->
    </tbody>
  </table>
  <div id="status" style="margin-top: 10px; color: green; font-weight: bold;"></div>
  <script src="options.js"></script>
</body>
</html>
