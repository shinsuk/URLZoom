<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; padding: 12px; font-family: sans-serif; box-sizing: border-box; }
    input { width: 100%; margin: 6px 0; box-sizing: border-box; }
    button { width: 100%; cursor: pointer; margin-top: 5px; padding: 6px 0; border-radius: 4px; box-sizing: border-box; }
    .save-btn { background: #1976D2; color: white; border: none; font-weight: bold; }
    .save-btn:hover { background: #1565C0; }
    .clear-btn { background: #eee; border: 1px solid #ccc; color: #333; }
    .clear-btn:hover { background: #e0e0e0; }
    .pause-btn { background: #fff; border: 1px solid #f57c00; color: #e65100; font-size: 12px; font-weight: bold; }
    .pause-btn:hover { background: #fff3e0; }
    .pause-btn.paused { background: #f57c00; color: #fff; border: 1px solid #e65100; }
    .pause-btn.paused:hover { background: #e65100; }
    .pause-banner { display: none; background: #fff3e0; border: 1px solid #ffe0b2; color: #e65100; padding: 6px; border-radius: 4px; font-size: 11px; margin: 6px 0; text-align: center; }
    .status { font-size: 11px; color: #666; margin-top: 8px; word-break: keep-all; }
  </style>
</head>
<body>
  <strong>URLZoom</strong>
  <div id="current-url" style="font-size: 10px; word-break: break-all; color: #888; margin: 4px 0;"></div>
  
  <div id="pauseBanner" class="pause-banner">⏸️ 이 탭에서 자동 줌 일시정지 중</div>

  <input type="number" id="zoomInput" step="5" value="100"> %
  <button id="saveBtn" class="save-btn">이 URL에 저장</button>
  <button id="clearBtn" class="clear-btn">설정 삭제</button>
  <button id="pauseBtn" class="pause-btn">현재 탭에서 줌 일시정지</button>
  <button id="optionsBtn" style="background: none; border: none; color: #0066cc; text-decoration: underline; font-size: 11px; margin-top: 10px;">저장 목록 관리</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
