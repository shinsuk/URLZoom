<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 200px; padding: 10px; font-family: sans-serif; }
    input { width: 100%; margin: 5px 0; }
    button { width: 100%; cursor: pointer; margin-top: 5px; }
    .status { font-size: 11px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <strong>URLZoom</strong>
  <div id="current-url" style="font-size: 10px; word-break: break-all; color: #888;"></div>
  <input type="number" id="zoomInput" step="5" value="100"> %
  <button id="saveBtn">이 URL에 저장</button>
  <button id="clearBtn" style="background: #eee; border: 1px solid #ccc;">설정 삭제</button>
  <button id="optionsBtn" style="background: none; border: none; color: #0066cc; text-decoration: underline; font-size: 11px; margin-top: 10px;">저장 목록 관리</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
